name: Recuperar LUMINA APK
on:
  push:
    branches: [main]
permissions:
  contents: read
  actions: read
jobs:
  recuperar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: LUMINA-APK-Prueba
          run-id: 43777160145
          github-token: ${{ github.token }}
          path: apk
      - name: Preparar entrega del APK
        run: |
          echo LUMINA_APK_BEGIN
          base64 -w 0 apk/app-debug.apk
          echo
          echo LUMINA_APK_END
          sha256sum apk/app-debug.apk
